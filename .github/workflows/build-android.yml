name: Build Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Настройка Java (нужна для Gradle)
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Flutter
      - name: Setup Flutter 3.38.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3" # ← Важно именно эта версия
          channel: "stable"
          cache: true

      - name: Init
        run: |
          make init
        env:
          GPR_KEY: ${{ secrets.GPR_KEY }}

      # - name: Get dependencies
      #   run: |
      #     # flutter pub get
      #   env:
      #     GPR_KEY: ${{ secrets.GPR_KEY }}

      - name: Code generation
        run: make gen

      # ==================== Подпись ====================
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/trusttunnel.keystore \
            -alias trusttunnel \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -sigalg SHA256withRSA \
            -dname "CN=TrustTunnel, OU=Dev, O=TrustTunnel, L=, S=, C=RU" \
            -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Create local.properties
        run: |
          cat > android/local.properties << EOF
          flutter.sdk=${FLUTTER_ROOT}
          flutter.versionCode=1
          flutter.versionName=1.2.0-custom
          signingConfigKeyAlias=trusttunnel
          signingConfigKeyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          signingConfigKeyStorePath=./trusttunnel.keystore
          signingConfigKeyStorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      - name: Build Release APKs
        run: |
          echo "GPR_KEY length: ${#GPR_KEY}"
          flutter build apk --release --split-per-abi
        env:
          GPR_KEY: ${{ secrets.GPR_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # - name: Upload Artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: TrustTunnel-APKs
      #     path: build/app/outputs/flutter-apk/*.apk
      #     retention-days: 30

      # Create Github release with current date
      - name: Calculate tag version
        run: |
          CURRENT_DATE=$(date +"%Y.%m.%d")
          BASE_TAG="${CURRENT_DATE}"
          COUNT=1

          git fetch --tags

          while git rev-parse "$BASE_TAG-$COUNT" >/dev/null 2>&1; do
            COUNT=$((COUNT + 1))
          done

          if [ $COUNT -eq 1 ] && ! git rev-parse "$BASE_TAG" >/dev/null 2>&1; then
            FINAL_TAG="$BASE_TAG"
          else
            FINAL_TAG="$BASE_TAG-$COUNT"
          fi

          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_ENV
          echo "$FINAL_TAG"

      - name: Create and push Git tag
        run: |
          git tag "$FINAL_TAG"
          git push origin "$FINAL_TAG"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FINAL_TAG }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/*.apk
