name: Build Android

on:
  push:
    branches: [ main, master, my-custom-build ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:  # ручной запуск

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Настройка Java (нужна для Gradle)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38'   # или stable
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          flutter pub get
        env:
          GPR_KEY: ${{ secrets.GPR_KEY }}

      - name: Code generation
        run: make gen   # или dart run build_runner build --delete-conflicting-outputs

      # Подпись (рекомендуется)
      # - name: Decode Keystore
      #   run: |
      #     echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/trusttunnel.keystore

      # === Подпись приложения ===
      - name: Generate Keystore (если ещё нет)
        run: |
          keytool -genkey -v -keystore android/trusttunnel.keystore -keyalg RSA -keysize 2048 -validity 10000 \
            -alias trusttunnel -dname "CN=TrustTunnel, OU=Dev, O=TrustTunnel, L=Unknown, S=Unknown, C=RU" \
            -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Create local.properties for signing
        run: |
          cat > android/local.properties << EOF
          signingConfigKeyAlias=trusttunnel
          signingConfigKeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          signingConfigKeyStorePath=./trusttunnel.keystore
          signingConfigKeyStorePassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          flutter.versionCode=1
          flutter.versionName=1.0.0
          EOF

      - name: Build APK (release, split)
        run: flutter build apk --release --split-per-abi

      # Или AAB:
      # - name: Build AAB
      #   run: flutter build appbundle --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 30